<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ホーム画面に追加したときにアプリとして全画面起動する（PWA） -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="受験ナビ" />
    <!-- 数字（得点・日付など）が勝手に電話番号リンクにならないようにする -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>受験ナビ</title>
    <style>
      /* 起動スプラッシュ（JS の読み込み完了まで表示。Vue のマウントで置き換わる） */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7f9;
      }
      .boot-logo {
        width: 68px;
        height: 68px;
        border-radius: 17px;
        background: #1c2024;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 30px rgba(28, 32, 36, 0.18);
        animation: bootIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes bootIn {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot-logo">
          <svg width="40" height="40" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 9.6C14.5 8.4 12.3 7.8 9.7 7.8C8.5 7.8 7.5 7.9 6.7 8.1V23.1C7.5 22.9 8.5 22.8 9.7 22.8C12.3 22.8 14.5 23.4 16 24.6" />
            <path d="M16 9.6C17.5 8.4 19.7 7.8 22.3 7.8C23.5 7.8 24.5 7.9 25.3 8.1V23.1C24.5 22.9 23.5 22.8 22.3 22.8C19.7 22.8 17.5 23.4 16 24.6" />
            <path d="M16 9.6V24.6" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
